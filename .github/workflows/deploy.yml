# Publishes to Pages on every push to main, mirroring dewlab's own
# deploy.yml so the two repositories' publish stories stay recognisable
# as siblings.
#
# This is the actual single-file build (`bun run build`, step 2 of
# planning/PLAN.md) as of the change that added this note — not the
# design sketch it published as a placeholder before a real app existed.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run build
          touch dist/.nojekyll

      # A build that produced nothing would otherwise publish an empty
      # site over a working one, silently — dewlab's own deploy.yml checks
      # this for the same reason.
      - name: Check something was actually built
        run: test -f dist/index.html || { echo "no index.html was built"; exit 1; }

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v5

# Publishes to Pages on every push to main, mirroring dewlab's own
# deploy.yml so the two repositories' publish stories stay recognisable
# as siblings.
#
# This is the actual single-file build (`bun run build`, step 2 of
# planning/PLAN.md) as of the change that added this note — not the
# design sketch it published as a placeholder before a real app existed.
#
# Pages itself has never been turned on for this repository (Settings →
# Pages → Source: GitHub Actions is a one-time, admin-only toggle;
# nothing this workflow's own token can do reaches it — actions/configure-
# pages's own attempt to do so is exactly what was failing here, "Resource
# not accessible by integration"). Until that toggle happens, "check
# Pages is enabled" below skips the rest of the job instead of failing
# it, so a real problem with the build still fails loudly but this
# expected, one-time gap stops sending a failure email on every push.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run build
          touch dist/.nojekyll

      # A build that produced nothing would otherwise publish an empty
      # site over a working one, silently — dewlab's own deploy.yml checks
      # this for the same reason.
      - name: Check something was actually built
        run: test -f dist/index.html || { echo "no index.html was built"; exit 1; }

      # A 404 here means Pages has never been turned on — that's the
      # expected state until an admin does the one-time Settings toggle,
      # not a failure of this workflow. A real API/network error (any
      # other non-zero exit) is left to fail loudly rather than be
      # swallowed as "not enabled".
      - name: Check whether Pages is enabled
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/tmp/pages-check.err; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" /tmp/pages-check.err; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages isn't enabled for this repository yet — an admin needs to turn it on once, at Settings → Pages → Source: GitHub Actions. Skipping deploy until then; this is expected, not a failure."
          else
            cat /tmp/pages-check.err
            exit 1
          fi

      - uses: actions/configure-pages@v6
        if: steps.pages-check.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: dist

      - id: deploy
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5

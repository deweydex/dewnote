# Runs the block model, dialect and export tests, plus the type checker,
# on every push to main and every pull request — so a dependency bump
# (this repo's own or Dependabot's, see dependabot.yml) has to pass the
# same gate a hand-written change does before it lands. The full-corpus
# test (src/full-corpus.test.ts) needs dewlab and dewstack checked out
# beside this repo and skips itself here, same as it does for anyone
# who clones dewnote alone; the fixtures/ round trip is what actually
# runs in CI.
#
# The Playwright suite (tests/e2e/) stays local and manual for the same
# reason dewlab's own tests.yml keeps its e2e suite out of CI: it needs a
# real build and a real browser, and would dominate this workflow for a
# suite that guards the surface, not the block model — see dewlab
# DECISIONS_LOG 0.17, 0.20 for the same call made there.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a human re-run the checks without inventing a commit to do it
  # with — a push made by a GitHub App does not start a workflow, so a
  # branch updated that way can otherwise sit with no checks at all.
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

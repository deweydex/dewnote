# Runs the unit tests and the type checker on every push to main and
# every pull request, so a dependency bump (this repo's own or
# Dependabot's, see dependabot.yml) passes the same gate a hand-written
# change does. The corpus tests in checks.test.ts and modules.test.ts
# need dewlab checked out beside this repo and skip themselves here.
#
# The Playwright suite (tests/e2e/), including the round-trip test the
# README calls the one that matters, does not run here yet: it needs a
# build and a browser. Run it locally with `bun run test:e2e`, or on
# demand with the e2e workflow. Bringing it into this gate is on
# planning/ROADMAP.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a human re-run the checks without inventing a commit to do it
  # with — a push made by a GitHub App does not start a workflow, so a
  # branch updated that way can otherwise sit with no checks at all.
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

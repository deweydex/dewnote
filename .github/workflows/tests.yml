# Every push to main and every pull request runs two jobs:
#
# - unit: the unit tests and the type checker. The corpus tests in
#   checks.test.ts and modules.test.ts need dewlab checked out beside this
#   repo and skip themselves here.
# - e2e: the built single file, driven in Chromium by Playwright. This
#   includes roundtrip.spec.ts, the test the README says the application
#   stands on, and pyodide.spec.ts, which runs real Python fetched from
#   jsDelivr. DEWNOTE_REQUIRE_PYODIDE makes an unreachable jsDelivr a
#   failure here rather than a skip, so those tests cannot quietly stop
#   running.
#
# A dependency bump (this repo's own or Dependabot's, see dependabot.yml)
# passes the same gate a hand-written change does.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a human re-run the checks without inventing a commit to do it
  # with — a push made by a GitHub App does not start a workflow, so a
  # branch updated that way can otherwise sit with no checks at all.
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright's browser
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run the e2e suite
        run: bunx playwright test
        env:
          DEWNOTE_REQUIRE_PYODIDE: "1"

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

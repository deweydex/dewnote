# The whole Playwright suite, on demand, on a runner with real internet
# access, so Pyodide can be fetched from jsDelivr. tests.yml does not run
# the e2e suite; use this for a change that touches cell execution or the
# round trip. A development sandbox with restricted network can run
# everything except a real Python cell.
name: e2e (pyodide)

on:
  workflow_dispatch:

jobs:
  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright's browser
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run the e2e suite
        run: bunx playwright test
